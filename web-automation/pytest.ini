[pytest]
# Default command line options
# Note: Playwright uses bundled Chromium by default (installed via 'playwright install chromium').
# To use locally installed Google Chrome, pass '--browser-channel chrome' via CLI or add below.
addopts = 
    --browser chromium 
    --html=reports/report.html 
    --self-contained-html
    -v

# Where to find tests
testpaths = tests

# Test function/file naming conventions
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for grouping tests (e.g. @pytest.mark.smoke)
markers =
    smoke: Quick critical path tests
    regression: Full regression test suite
